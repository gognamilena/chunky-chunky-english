<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chunky Chunky English — Учись. Практикуй. Говори!</title>
<style>
:root{--g:#4eae42;--gd:#17542d;--mint:#e8f7df;--cream:#fffdf6;--ink:#25362b;--muted:#738276;--line:#e6eddf;--yellow:#ffda61;--shadow:0 12px 34px #27582b16}
*{box-sizing:border-box}body{margin:0;background:#f4faef;color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;border:0}button:focus-visible,input:focus-visible{outline:3px solid #f2bd32;outline-offset:3px}
.wrap{max-width:1280px;margin:auto;padding:0 28px}.top{height:78px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:23px;line-height:.95;font-weight:1000;letter-spacing:-1px;color:var(--gd)}.brand small{display:block;font-size:9px;letter-spacing:2px;margin-top:8px;color:#849585}.nav{display:flex;gap:8px;align-items:center}.nav button,.lang{background:#ffffffb8;padding:10px 15px;border-radius:99px;font-weight:750;color:#405345}.nav button:hover{background:#e4f5dc}.pill{background:#fff;border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-weight:800}.green{background:var(--g);color:white;padding:13px 22px;border-radius:14px;font-weight:900;box-shadow:0 4px 0 #378532}.green:hover{filter:brightness(.96);transform:translateY(-1px)}.soft{background:#eaf6e4;color:var(--gd);padding:12px 18px;border-radius:13px;font-weight:850}.hero{background:linear-gradient(120deg,#e4f7d8,#a5e88c 75%,#8edb79);border-radius:30px;display:grid;grid-template-columns:1.05fr 1fr .95fr;align-items:center;gap:10px;padding:28px 34px;min-height:440px;overflow:hidden;box-shadow:var(--shadow);position:relative}.hero:before{content:"";position:absolute;inset:auto -5% -90px -5%;height:170px;background:#f8ffe9;border-radius:50%}.hero-copy,.hero-mascot,.signup{position:relative;z-index:1}.eyebrow{font-size:12px;font-weight:900;letter-spacing:1.5px;color:#4e7652;text-transform:uppercase}.hero h1{font-size:clamp(36px,4.5vw,62px);line-height:.98;letter-spacing:-2px;color:var(--gd);margin:13px 0}.tagline{font-size:clamp(18px,2vw,24px);font-weight:850;color:#326c3c;font-style:italic}.hero p{color:#355c3b;max-width:410px}.hero-mascot img{width:100%;max-height:385px;object-fit:contain;mix-blend-mode:multiply;filter:drop-shadow(0 12px 12px #366a2b1a)}.signup{background:#fffdf7ed;border:1px solid #fff;border-radius:25px;padding:23px;box-shadow:0 12px 30px #456d3520}.signup h2{margin:0 0 5px;color:var(--gd)}.signup p{margin:0 0 14px;color:var(--muted);font-size:14px}.field{width:100%;padding:13px 14px;border:1.5px solid #e5e9df;border-radius:13px;margin:6px 0;background:white}.field:focus{border-color:var(--g)}.signup .green{width:100%;margin-top:8px}.link{color:#267532;font-weight:850;background:none;padding:8px}.feature-area{display:grid;grid-template-columns:1.35fr .9fr;gap:18px;margin:20px 0}.features{background:var(--cream);border-radius:25px;padding:20px}.features h2,.testbox h2{margin:0 0 14px}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{border-radius:18px;padding:16px 10px;text-align:center;min-height:145px}.tile:nth-child(1){background:#ffe7e9}.tile:nth-child(2){background:#e3f5e2}.tile:nth-child(3){background:#fff0c9}.tile:nth-child(4){background:#eee4ff}.tile b{display:block;margin:6px 0}.tile .ico{font-size:30px}.tile small{color:#536257}.testbox{background:#e7f5d8;border-radius:25px;padding:23px;display:flex;flex-direction:column;justify-content:center}.testbox .ico{font-size:40px}.testbox p{color:#49684c}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fffdf7;border-radius:22px;padding:16px 22px;margin-bottom:28px;color:#607064;font-weight:750}.screen{max-width:900px;margin:35px auto;background:white;border:1px solid var(--line);border-radius:26px;padding:clamp(22px,4vw,42px);box-shadow:var(--shadow)}.center{text-align:center}.mascot-small{width:170px;height:150px;object-fit:contain;mix-blend-mode:multiply}.screen h1{color:var(--gd);font-size:36px;line-height:1.08;margin:10px 0}.screen p{color:var(--muted)}.form{max-width:440px;margin:20px auto;text-align:left}.form label{font-size:13px;font-weight:800;color:#526555}.form .green{width:100%;margin-top:12px}.switch{margin-top:14px;text-align:center}.error{color:#b34335;font-size:13px;min-height:18px}.answers{display:grid;gap:10px;margin:20px 0}.answer{background:#fff;border:2px solid var(--line);padding:14px 16px;text-align:left;border-radius:14px;font-weight:750}.answer:hover,.answer.selected{border-color:var(--g);background:#f0faeb}.progress{height:10px;background:#edf2e9;border-radius:20px;overflow:hidden;margin:12px 0 20px}.progress i{display:block;background:var(--g);height:100%;width:0}.dashboard{max-width:1100px;margin:28px auto}.dashhero{background:linear-gradient(110deg,#c8efb4,#90df7b);padding:26px;border-radius:25px;display:flex;align-items:center;gap:18px}.dashhero img{width:150px;height:140px;object-fit:contain;mix-blend-mode:multiply}.dashhero h1{color:var(--gd);margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.stat strong{display:block;font-size:25px}.stat small{color:var(--muted)}.panel{margin-top:14px}.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.badge{font-size:12px;background:#eaf6e4;color:#347638;padding:5px 9px;border-radius:99px;font-weight:850}.hidden{display:none!important}.foot{text-align:center;color:#8a988b;font-size:12px;padding:18px}
@media(max-width:980px){.hero{grid-template-columns:1fr 1fr}.signup{grid-column:1/-1;max-width:520px;width:100%;margin:auto}.hero-mascot{grid-column:2;grid-row:1}.hero-copy{grid-column:1;grid-row:1}.feature-area{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(4,1fr)}}
@media(max-width:650px){.wrap{padding:0 14px}.top{height:auto;padding:15px 0;align-items:flex-start}.nav{display:none}.hero{display:flex;flex-direction:column;text-align:center;padding:22px 17px}.hero p{margin-left:auto;margin-right:auto}.hero-mascot img{max-height:210px}.signup{max-width:none}.tiles{grid-template-columns:repeat(2,1fr)}.bottom{flex-direction:column;text-align:center}.screen{margin:18px 0;padding:22px}.screen h1{font-size:29px}.dashhero{flex-direction:column;text-align:center}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:20px}}
</style></head><body>
<div id="app"></div>
<script>
const KEY='chunky_v03_user';
let user=JSON.parse(localStorage.getItem(KEY)||'null');
const mascot='<img class="mascot-small" src="assets/chunky-mascot.png" alt="Chunky — оленёнок-учитель">';
function header(){return `<header class="wrap top"><div class="brand">Chunky Chunky<br>English<small>LEARN · PLAY · GROW</small></div><nav class="nav"><button onclick="welcome()">⌂ Главная</button><button onclick="about()">О курсе</button><button onclick="about()">Возможности</button></nav><div><span class="pill">🌐 RU</span> <button class="soft" onclick="login()">Войти</button></div></header>`}
function welcome(){document.getElementById('app').innerHTML=header()+`
<main class="wrap"><section class="hero"><div class="hero-copy"><span class="badge">⭐ Изучай английский по-новому</span><h1>Chunky Chunky<br>English</h1><div class="tagline">Учись. Практикуй. Говори!</div><p>Современный английский, полезные чанки, живой сленг и интерактивные уроки с милым оленёнком Chunky!</p><button class="green" onclick="register()">Начать обучение →</button></div><div class="hero-mascot"><img src="assets/chunky-mascot.png" alt="Chunky, твой оленёнок-учитель"></div><div class="signup"><h2>Присоединяйся!</h2><p>Создай аккаунт и начни свой путь к свободному английскому 🚀</p><input id="quickName" class="field" placeholder="Имя пользователя"><input id="quickEmail" class="field" type="email" placeholder="Email"><input id="quickPass" class="field" type="password" placeholder="Пароль (от 6 символов)"><div id="quickError" class="error"></div><button class="green" onclick="quickRegister()">Зарегистрироваться</button><div class="switch">Уже есть аккаунт? <button class="link" onclick="login()">Войти →</button></div></div></section>
<section class="feature-area"><div class="features"><h2>✨ Что тебя ждёт?</h2><div class="tiles"><div class="tile"><div class="ico">💬</div><b>Живой английский</b><small>Чанки, сленг и современные выражения</small></div><div class="tile"><div class="ico">🎧</div><b>Тренажёры</b><small>Аудирование, говорение, письмо</small></div><div class="tile"><div class="ico">🎮</div><b>Игровой формат</b><small>Баллы, достижения и серии дней</small></div><div class="tile"><div class="ico">📈</div><b>Путь A1–C1</b><small>Постепенное обучение</small></div></div></div><div class="testbox"><div class="ico">🎯</div><h2>Определи свой уровень!</h2><p>Пройди входной тест и получи персональную программу обучения.</p><button class="green" onclick="register()">Начать тест →</button></div></section><div class="bottom"><span>🦌 Учись в своём темпе вместе с Chunky!</span><span>Let's learn English together! ♡</span><span>⭐ A1 · A2 · B1 · B2 · C1</span></div></main>`}
function register(){document.getElementById('app').innerHTML=header()+`<section class="screen center">${mascot}<div class="eyebrow">СОЗДАНИЕ АККАУНТА</div><h1>Добро пожаловать в нашу команду!</h1><p>Создай аккаунт, чтобы сохранять результаты и продолжать обучение.</p><div class="form"><label>Имя пользователя</label><input class="field" id="name" placeholder="Как тебя называть?"><label>Email</label><input class="field" id="email" type="email" placeholder="name@example.com"><label>Пароль</label><input class="field" id="pass" type="password" placeholder="Минимум 6 символов"><div id="err" class="error"></div><button class="green" onclick="createAccount()">Создать аккаунт →</button><div class="switch">Уже зарегистрирован(а)? <button class="link" onclick="login()">Войти</button></div></div></section>`}
function quickRegister(){let n=document.getElementById('quickName').value,e=document.getElementById('quickEmail').value,p=document.getElementById('quickPass').value;create(n,e,p,'quickError')}
function createAccount(){create(document.getElementById('name').value,document.getElementById('email').value,document.getElementById('pass').value,'err')}
function create(n,e,p,errorId){let err=document.getElementById(errorId);if(!n.trim()||!e.includes('@')||p.length<6){err.textContent='Заполни имя, укажи корректный email и пароль не короче 6 символов.';return}user={name:n.trim(),email:e.trim().toLowerCase(),password:p,level:null,xp:0,done:0};localStorage.setItem(KEY,JSON.stringify(user));welcomeTest()}
function login(){document.getElementById('app').innerHTML=header()+`<section class="screen center">${mascot}<h1>С возвращением!</h1><p>Chunky уже приготовил для тебя новые задания.</p><div class="form"><label>Email</label><input id="loginEmail" class="field" type="email" placeholder="name@example.com"><label>Пароль</label><input id="loginPass" class="field" type="password" placeholder="Пароль"><div id="loginErr" class="error"></div><button class="green" onclick="doLogin()">Войти →</button><div class="switch">Нет аккаунта? <button class="link" onclick="register()">Зарегистрироваться</button></div></div></section>`}
function doLogin(){let e=document.getElementById('loginEmail').value.trim().toLowerCase(),p=document.getElementById('loginPass').value;let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(!saved||saved.email!==e||saved.password!==p){document.getElementById('loginErr').textContent='Не удалось войти. Проверь email и пароль на этом устройстве.';return}user=saved;if(!user.level)welcomeTest();else dashboard()}
const qs=[['She ___ a student.',['am','is','are'],1],['What does “I’m not really into it” mean?',['Мне это не особо нравится','Я очень занят','Я согласен'],0],['I ___ here since 2020.',['live','lived','have lived'],2],['If I ___ more time, I would travel.',['have','had','will have'],1],['“That’s wild!” обычно выражает…',['Скуку','Удивление','Согласие с правилами'],1],['Choose a natural collocation:',['make a decision','do a decision','take a decision'],0],['“Meticulous” means…',['careless','very careful and precise','very loud'],1]];
let qi=0,score=0;
function welcomeTest(){qi=0;score=0;testPage()}
function testPage(){let q=qs[qi];document.getElementById('app').innerHTML=header()+`<section class="screen"><div class="spaced"><span class="eyebrow">ВХОДНОЙ ТЕСТ · A1–C1</span><b>${qi+1} / ${qs.length}</b></div><div class="progress"><i style="width:${qi/qs.length*100}%"></i></div><div class="center">${mascot}<h1>Давай проверим твой английский!</h1><p>Выбирай один правильный ответ. Это короткий ознакомительный тест.</p></div><h2>${q[0]}</h2><div class="answers">${q[1].map((a,i)=>`<button class="answer" onclick="choose(${i})">${a}</button>`).join('')}</div><div id="testErr" class="error"></div><button id="next" class="green hidden" onclick="nextQ()">Следующий вопрос →</button></section>`}
function choose(i){if(document.querySelector('.answer[disabled]'))return;document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===qs[qi][2])b.classList.add('selected')});if(i===qs[qi][2])score++;document.getElementById('next').classList.remove('hidden')}
function nextQ(){qi++;if(qi<qs.length)testPage();else result()}
function result(){let level=score<=1?'A1':score<=2?'A2':score<=3?'B1':score<=5?'B2':'C1';user.level=level;localStorage.setItem(KEY,JSON.stringify(user));document.getElementById('app').innerHTML=header()+`<section class="screen center">${mascot}<div class="eyebrow">ТВОЙ ПРЕДВАРИТЕЛЬНЫЙ РЕЗУЛЬТАТ</div><h1 style="font-size:66px">${level}</h1><h2>${{A1:'Начальный уровень',A2:'Базовый уровень',B1:'Средний уровень',B2:'Выше среднего',C1:'Продвинутый уровень'}[level]}</h2><p>Правильных ответов: ${score} из ${qs.length}. Это ознакомительная оценка, не официальный сертификат CEFR. Позже добавим полноценные задания на чтение, аудирование и говорение.</p><button class="green" onclick="dashboard()">В мой личный кабинет →</button></section>`}
function dashboard(){document.getElementById('app').innerHTML=header()+`<main class="wrap dashboard"><section class="dashhero"><img src="assets/chunky-mascot.png" alt="Chunky"><div><div class="eyebrow">ТВОЙ ЛИЧНЫЙ КАБИНЕТ</div><h1>Привет, ${safe(user.name)}! 🦌</h1><p>Твой следующий шаг к уверенному английскому начинается здесь.</p><button class="green" onclick="lessons()">Продолжить обучение →</button></div></section><div class="stats"><div class="stat"><strong>⭐ ${user.xp}</strong><small>XP</small></div><div class="stat"><strong>🎯 ${user.done}</strong><small>уроков завершено</small></div><div class="stat"><strong>📘 ${user.level}</strong><small>твой уровень</small></div></div><section class="panel"><h2>Твоя программа обучения</h2><p class="muted">Подборка первых занятий для уровня ${user.level}.</p><div id="lessonList"></div></section><section class="panel"><div class="spaced"><b>Твой профиль</b><button class="link" onclick="logout()">Выйти</button></div><small class="muted">${safe(user.email)}</small></section></main>`;lessons()}
function lessons(){let list=[['💬','English chunks','Готовые фразы для естественного общения'],['🔥','Modern slang','Современный сленг и интернет-английский'],['📚','Grammar in context','Грамматика на реальных примерах'],['🎧','Listening practice','Понимание живой речи']];document.getElementById('lessonList').innerHTML=list.map((x,i)=>`<div class="lesson"><div><b>${x[0]} ${x[1]}</b><div class="muted">${x[2]}</div></div><button class="soft" onclick="demoLesson(${i})">Открыть →</button></div>`).join('')}
function demoLesson(i){let data=[['That makes sense','Это понятно / В этом есть смысл','A friend explains why they were late. You reply: “That makes sense.”'],['Low-key','Немного, если честно, втайне','“I’m low-key excited about the trip.”'],['Present Perfect','Связь прошлого с настоящим','I have lived here for three years.'],['Catch up','Пообщаться и узнать новости','Let’s catch up this weekend.']][i];document.getElementById('app').innerHTML=header()+`<section class="screen"><button class="link" onclick="dashboard()">← В кабинет</button><div class="center">${mascot}<div class="eyebrow">МИНИ-УРОК</div><h1>${data[0]}</h1><h2>${data[1]}</h2><p>${data[2]}</p><button class="green" onclick="completeLesson()">Понятно! +10 XP</button></div></section>`}
function completeLesson(){user.xp+=10;user.done+=1;localStorage.setItem(KEY,JSON.stringify(user));dashboard()}
function logout(){user=null;welcome()}
function about(){document.getElementById('app').innerHTML=header()+`<section class="screen center">${mascot}<h1>Английский, который нужен в жизни</h1><p>Chunky Chunky English объединяет системное обучение A1–C1, разговорные chunks, современный сленг, грамматику в контексте и игровые тренажёры.</p><button class="green" onclick="register()">Начать обучение →</button></section>`}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(user&&user.level)dashboard();else welcome();
</script></body></html>
